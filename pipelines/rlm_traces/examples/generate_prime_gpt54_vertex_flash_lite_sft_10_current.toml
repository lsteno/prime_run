run_name = "prime-gpt54-vertex-flash-lite-sft-10-current"
output_dir = "/Users/lsteno/Developer/GitHub/prime_run/outputs/rlm_traces"
endpoints_path = "configs/endpoints.toml"
resume = true
max_workers = 4

[model]
model = "openai/gpt-5.4"
url = "https://api.pinference.ai/api/v1"
api_key_env = "PRIME_API_KEY"

[model.extra_body.reasoning]
enabled = false

[llm_subcall]
provider = "vertex"
model = "gemini-3.1-flash-lite"
vertex_project_env = "GOOGLE_CLOUD_PROJECT"
vertex_location = "global"
thinking_level = "medium"

[dataset]
dataset_id = "lsteno/BEEG-agents"
split = "sft_traces"
source_ids = [
  "frames-0499",
  "CU_DFA-0055-9635247",
  "oolong-000936",
  "DRA_T1-0293-2124735",
  "frames-0551",
  "DRA_T1-0210-9646572",
  "CU_DFA-0272-9858310",
  "oolong-000280",
  "CU_P-0314-929167",
  "frames-0307",
]

[rollout]
prompt_variants = ["sanjaya_text_depth1_llm_only_v1"]
max_iterations = 15
max_depth = 1
disable_recursive_subcalls = true
turn_max_tokens = 2048
subcall_max_tokens = 2048
max_prompt_tokens = 200000
temperature = 0.7
top_p = 1.0
repl_backend = "local"
subcall_budget_enabled = true
max_total_subcalls = 80
max_batched_subcalls = 80
include_budget_reminder = false
tokenizer_name = "Qwen/Qwen3-4B-Instruct-2507"

[judge]
enabled = true
provider = "vertex"
model = "gemini-3-flash-preview"
vertex_project_env = "GOOGLE_CLOUD_PROJECT"
vertex_location = "global"
thinking_level = "medium"

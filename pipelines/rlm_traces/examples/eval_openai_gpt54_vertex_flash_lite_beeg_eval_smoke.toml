run_name = "openai-gpt54-vertex-flash-lite-beeg-eval-smoke"
output_dir = "/Users/lsteno/Developer/GitHub/prime_run/outputs/evals"
endpoints_path = "configs/endpoints.toml"
resume = true
progress = true
max_workers = 1
worker_backend = "serial"

[model]
endpoint_id = "openai-gpt-5.4"

[llm_subcall]
provider = "vertex"
model = "gemini-3.1-flash-lite"
vertex_project_env = "GOOGLE_CLOUD_PROJECT"
vertex_location = "global"
thinking_level = "medium"
empty_response_max_attempts = 3
empty_response_base_retry_seconds = 1.0
empty_response_max_retry_seconds = 30.0

[dataset]
dataset_id = "lsteno/BEEG-agents"
split = "eval"
max_examples = 3
seed = 42

[rollout]
prompt_variants = ["sanjaya_text_depth1_llm_only_v1"]
max_iterations = 15
max_depth = 1
disable_recursive_subcalls = true
turn_max_tokens = 2048
subcall_max_tokens = 2048
max_prompt_tokens = 61440
subcall_prompt_limit_ratio = 0.85
temperature = 0.7
top_p = 1.0
repl_backend = "local"
subcall_budget_enabled = true
max_total_subcalls = 50
max_batched_subcalls = 50
include_budget_reminder = false
tokenizer_name = "Qwen/Qwen3-4B-Instruct-2507"

[judge]
enabled = true
provider = "vertex"
model = "gemini-3-flash-preview"
vertex_project_env = "GOOGLE_CLOUD_PROJECT"
vertex_location = "global"
thinking_level = "medium"
max_attempts = 6
base_retry_seconds = 1.0
max_retry_seconds = 30.0

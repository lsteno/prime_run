[project]
name = "rlm-rlvr"
description = "Recursive RLVR environment for training RLM-style policies with Prime RL"
tags = ["rlvr", "recursive", "prime-rl", "train", "eval"]
version = "0.1.3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.1.0",
    "google-genai[aiohttp]>=1.51.0",
    "openai==2.26.0",
    "openai-agents==0.12.0",
    "pandas>=2.2.0",
    "portkey-ai==2.1.0",
    "prime-sandboxes==0.2.16",
    "rlms[prime]==0.1.1",
    "transformers>=4.55.0",
    "verifiers==0.1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_rlvr"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.8, "parents": "seed", "role": "Seed", "components": {"system_prompt": "You are tasked with answering a query with associated context. You can access, transform, and analyze this context interactively in a REPL environment that can recursively query sub-LLMs, which you are strongly encouraged to use as much as possible. You will be queried iteratively until you provide a final answer.\n\nThe REPL environment is initialized with:\n1. A `context` variable that contains extremely important information about your query. You should check the content of the `context` variable to understand what you are working with. Make sure you look through it sufficiently as you answer your query.\n2. A `llm_query(prompt, model=None)` function that makes a single LLM completion call (no REPL, no iteration). Fast and lightweight -- use this for simple extraction, summarization, or Q&A over a chunk of text. The sub-LLM can handle around 500K chars.\n3. A `llm_query_batched(prompts, model=None)` function that runs multiple `llm_query` calls concurrently: returns `List[str]` in the same order as input prompts. Much faster than sequential `llm_query` calls for independent queries.\n4. A `rlm_query(prompt, model=None)` function that spawns a **recursive RLM sub-call** for deeper thinking subtasks. The child gets its own REPL environment and can reason iteratively over the prompt, just like you. Use this when a subtask requires multi-step reasoning, code execution, or its own iterative problem-solving -- not just a simple one-shot answer. Falls back to `llm_query` if recursion is not available.\n5. A `rlm_query_batched(prompts, model=None)` function that spawns multiple recursive RLM sub-calls. Each prompt gets its own child RLM. Falls back to `llm_query_batched` if recursion is not available.\n6. A `SHOW_VARS()` function that returns all variables you have created in the REPL. Use this to check what variables exist before using FINAL_VAR.\n7. The ability to use `print()` statements to view the output of your REPL code and continue your reasoning.\n\n\n**When to use `llm_query` vs `rlm_query`:**\n- Use `llm_query` for simple, one-shot tasks: extracting info from a chunk, summarizing text, answering a factual question, classifying content. These are fast single LLM calls.\n- Use `rlm_query` when the subtask itself requires deeper thinking: multi-step reasoning, solving a sub-problem that needs its own REPL and iteration, or tasks where a single LLM call might not be enough. The child RLM can write and run code, query further sub-LLMs, and iterate to find the answer.\n\n**Breaking down problems:** You must break problems into more digestible components\u2014whether that means chunking or summarizing a large context, or decomposing a hard task into easier sub-problems and delegating them via `llm_query` / `rlm_query`. Use the REPL to write a **programmatic strategy** that uses these LLM calls to solve the problem, as if you were building an agent: plan steps, branch on results, combine answers in code.\n\n**REPL for computation:** You can also use the REPL to compute programmatic steps (e.g. `math.sin(x)`, distances, physics formulas) and then chain those results into an LLM call. For complex math or physics, compute intermediate quantities in code and pass the numbers to the LM for interpretation or the final answer. Example: data describes an electron in a magnetic field undergoing helical motion; task is to find the entry angle.\n```repl\nimport math\n# Suppose the context or an earlier LM call gave us: B, m, q, pitch, R (radius). Extract or set them.\n# Helical motion: v_parallel = pitch * (q*B)/(2*pi*m), v_perp = R * (q*B)/m. Entry angle theta: tan(theta) = v_perp/v_parallel.\nv_parallel = pitch * (q * B) / (2 * math.pi * m)\nv_perp = R * (q * B) / m\ntheta_rad = math.atan2(v_perp, v_parallel)\ntheta_deg = math.degrees(theta_rad)\nfinal_answer = llm_query(f\"An electron entered a B field and underwent helical motion. Computed entry angle: {theta_deg:.2f} deg. State the answer clearly for the user.\")\n```\nYou will only be able to see truncated outputs from the REPL environment, so you should use the query LLM function on variables you want to analyze. You will find this function especially useful when you have to analyze the semantics of the context. Use these variables as buffers to build up your final answer.\nMake sure to explicitly look through the entire context in REPL before answering your query. Break the context and the problem into digestible pieces: e.g. figure out a chunking strategy, break up the context into smart chunks, query an LLM per chunk and save answers to a buffer, then query an LLM over the buffers to produce your final answer.\n\nYou can use the REPL environment to help you understand your context, especially if it is huge. Remember that your sub LLMs are powerful -- they can fit around 500K characters in their context window, so don't be afraid to put a lot of context into them. For example, a viable strategy is to feed 10 documents per sub-LLM query. Analyze your input data and see if it is sufficient to just fit it in a few sub-LLM calls!\n\nWhen you want to execute Python code in the REPL environment, wrap it in triple backticks with 'repl' language identifier. For example, say we want our recursive model to search for the magic number in the context (assuming the context is a string), and the context is very long, so we want to chunk it:\n```repl\nchunk = context[:10000]\nanswer = llm_query(f\"What is the magic number in the context? Here is the chunk: {chunk}\")\nprint(answer)\n```\n\nAs an example, suppose you're trying to answer a question about a book. You can iteratively chunk the context section by section, query an LLM on that chunk, and track relevant information in a buffer.\n```repl\nquery = \"In Harry Potter and the Sorcerer's Stone, did Gryffindor win the House Cup because they led?\"\nfor i, section in enumerate(context):\n    if i == len(context) - 1:\n        buffer = llm_query(f\"You are on the last section of the book. So far you know that: {buffers}. Gather from this last section to answer {query}. Here is the section: {section}\")\n        print(f\"Based on reading iteratively through the book, the answer is: {buffer}\")\n    else:\n        buffer = llm_query(f\"You are iteratively looking through a book, and are on section {i} of {len(context)}. Gather information to help answer {query}. Here is the section: {section}\")\n        print(f\"After section {i} of {len(context)}, you have tracked: {buffer}\")\n```\n\nAs another example, when the context isn't that long (e.g. >100M characters), a simple but viable strategy is, based on the context chunk lengths, to combine them and recursively query an LLM over chunks. For example, if the context is a List[str], we ask the same query over each chunk using `llm_query_batched` for concurrent processing:\n```repl\nquery = \"A man became famous for his book \"The Great Gatsby\". How many jobs did he have?\"\n# Suppose our context is ~1M chars, and we want each sub-LLM query to be ~0.1M chars so we split it into 10 chunks\nchunk_size = len(context) // 10\nchunks = []\nfor i in range(10):\n    if i < 9:\n        chunk_str = \"\n\".join(context[i*chunk_size:(i+1)*chunk_size])\n    else:\n        chunk_str = \"\n\".join(context[i*chunk_size:])\n    chunks.append(chunk_str)\n\n# Use batched query for concurrent processing - much faster than sequential calls!\nprompts = [f\"Try to answer the following query: {query}. Here are the documents:\n{chunk}. Only answer if you are confident in your answer based on the evidence.\" for chunk in chunks]\nanswers = llm_query_batched(prompts)\nfor i, answer in enumerate(answers):\n    print(f\"I got the answer from chunk {i}: {answer}\")\nfinal_answer = llm_query(f\"Aggregating all the answers per chunk, answer the original query about total number of jobs: {query}\\n\\nAnswers:\\n\" + \"\\n\".join(answers))\n```\n\nFor subtasks that require deeper reasoning (e.g. solving a complex sub-problem), use `rlm_query` instead. The child gets its own REPL to iterate; you can then use the result in parent logic:\n```repl\n# Child RLM solves the sub-problem in its own REPL; we use the result in code\ntrend = rlm_query(f\"Analyze this dataset and conclude with one word: up, down, or stable: {data}\")\nif \"up\" in trend.lower():\n    recommendation = \"Consider increasing exposure.\"\nelif \"down\" in trend.lower():\n    recommendation = \"Consider hedging.\"\nelse:\n    recommendation = \"Hold position.\"\nfinal_answer = llm_query(f\"Given trend={trend} and recommendation={recommendation}, one-sentence summary for the user.\")\n```\n\nAs a final example, implement the solution as a **program**: try one approach via `rlm_query`; inspect the result and branch. If it suffices, use it. If not, break into one easier subproblem and delegate that only. More branches, one path runs\u2014don't load the model. Example: prove sqrt 2 irrational.\n```repl\nr = rlm_query(\"Prove sqrt 2 is irrational. Give a 1-2 sentence proof, or reply only: USE_LEMMA or USE_CONTRADICTION.\")\nif \"USE_LEMMA\" in r.upper():\n    final_answer = rlm_query(\"Prove 'n^2 even => n even' then use it to show sqrt 2 irrational. Two sentences.\")\n\nIMPORTANT: When you are done with the iterative process, you MUST provide a final answer inside a FINAL function when you have completed your task, NOT in code. Do not use these tags unless you have completed your task. You have two options:\n1. Use FINAL(your final answer here) to provide the answer directly\n2. Use FINAL_VAR(variable_name) to return a variable you have created in the REPL environment as your final output\n\nWARNING - COMMON MISTAKE: FINAL_VAR retrieves an EXISTING variable. You MUST create and assign the variable in a ```repl``` block FIRST, then call FINAL_VAR in a SEPARATE step. For example:\n- WRONG: Calling FINAL_VAR(my_answer) without first creating `my_answer` in a repl block\n- CORRECT: First run ```repl\nmy_answer = \"the result\"\nprint(my_answer)\n``` then in the NEXT response call FINAL_VAR(my_answer)\n\nIf you're unsure what variables exist, you can call SHOW_VARS() in a repl block to see all available variables.\n\nThink step by step carefully, plan, and execute this plan immediately in your response -- do not just say \"I will do this\" or \"I will do that\". Output to the REPL environment and recursive LLMs as much as possible. Remember to explicitly answer the original query in your final answer.\n"}},
{"idx": 1, "score": 0.9, "parents": "0", "role": "Best", "components": {"system_prompt": "You are a specialist in processing contextual data from a sophisticated REPL environment. Your task is to analyze contextual information provided in the `context` variable to answer specific questions, using an iterative strategy that involves checking, transforming, and analyzing the context through the available tools.\n\n**Core Principles for Context Processing:**\n1. ALWAYS inspect the `context` variable first using `print(context[:1000])` or `print(type(context))` before attempting any analysis.\n2. Context is often a string rather than structured data; ALWAYS split into lines using `context.splitlines()` before processing.\n3. When processing line-based data, the first line is typically a header, so exclude it: `data_lines = context.splitlines()[1:]`.\n4. If your processing involves extraction from lines (e.g., \"User: 123\"), always check for the presence of the expected pattern before trying to extract:\n   ```python\n   if \"User: \" in line:\n       user_id = line.split(\"User: \")[1].split(\" || \")[0]\n   ```\n5. Always count occurrences and filter based on your specific criteria (e.g., count == 3675).\n\n**Available Tools & Best Practices:**\n- `llm_query(prompt, model=None)`: For simple extraction when the context is small enough (up to 500K characters). Use for:\n  - Summarizing chunks of text\n  - Answering factual questions about chunks\n  - Simple classification\n- `llm_query_batched(prompts)`: For concurrent processing of multiple chunks\n- `rlm_query(prompt, model=None)`: For multi-step reasoning or when the subtask requires its own iterative problem-solving\n- `rlm_query_batched(prompts)`: For concurrent RLM subtasks\n- `SHOW_VARS()`: Always check variables before using them\n\n**Workflow for Text-Based Context Analysis:**\n1. First, check the context structure:\n   ```repl\n   print(\"Context type:\", type(context))\n   print(\"First 200 chars:\", context[:200])\n   ```\n2. If the context is a string:\n   - Split into lines: `lines = context.splitlines()`\n   - Verify line count: `print(\"Total lines:\", len(lines))`\n   - Process data lines: `data_lines = lines[1:]` (exclude header)\n3. Extract required information from data lines, adding error handling.\n4. Count/analyze data and prepare the final answer.\n5. Output in strict format (no extra text, no Markdown).\n\n**Critical Notes on Avoiding Common Errors:**\n- DO NOT attempt to iterate over a string as if it were a list (will cause `TypeError: string indices must be integers`).\n- DO NOT assume structure without checking first (will cause `IndexError`).\n- DO NOT output extra text (only the required output).\n- ALWAYs process context as a string when it's a string, not as structured data.\n\n**Example: Finding a Specific User with Exact Example Count**\n```repl\n# First check context structure\nprint(type(context))\nprint(context[:200])\n\n# Split context into lines\nlines = context.splitlines()\ndata_lines = lines[1:]  # Skip header\n\n# Count user examples\nuser_counts = {}\nfor line in data_lines:\n    if \"User: \" in line:\n        user_id = line.split(\"User: \")[1].split(\" || \")[0]\n        user_counts[user_id] = user_counts.get(user_id, 0) + 1\n\n# Find user with exact count\nresult = [user for user, count in user_counts.items() if count == 3675]\nif result:\n    print(f\"User: {result[0]}\")\nelse:\n    print(\"No user found with 3675 examples\")\n```\n\n**Required Output Format:**\nIf the answer is found, output EXACTLY: \"User: ID\" (e.g., \"User: 97130\").\nNever output anything extra."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.80)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.90)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>

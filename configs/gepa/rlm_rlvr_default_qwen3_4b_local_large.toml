model = "Qwen/Qwen3-4B-Thinking-2507"
reflection_model = "qwen3-30b-t"
endpoints_path = "../endpoints.toml"
api_base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"

[env]
env_id = "rlm_rlvr"
env_args = { dataset_id = "lsteno/BEEG-agents", dataset_train_split = "train", dataset_eval_split = "eval", seed = 42, prompt_variant = "default", max_iterations = 19, max_depth = 2, turn_max_tokens = 1024, subcall_max_tokens = 768, max_prompt_tokens = 258048, tokenizer_name = "Qwen/Qwen3-4B-Thinking-2507", inference_mode = "local", inference_base_url = "http://localhost:8000/v1", inference_api_key = "local-vllm", repl_backend = "local", judge_model = "z-ai/glm-5" }
extra_env_kwargs = {}

[gepa]
max_calls = 1000
num_train = 200
num_val = 100
minibatch_size = 3
perfect_score = 1.0

[execution]
max_concurrent = 8
seed = 42
sampling_args = { max_tokens = 1024, temperature = 0.7, top_p = 1.0 }

# Full-SFT warmup for paper-style per-root-turn RLM trace rows on Qwen3-8B.
#
# There is no official dense Qwen3-8B-Instruct-2507 checkpoint analogous to
# Qwen/Qwen3-4B-Instruct-2507. Qwen/Qwen3-8B's hybrid chat template injects
# empty <think> blocks in supervised assistant messages even with
# enable_thinking=false, so this config trains Qwen/Qwen3-8B weights with the
# compatible Qwen/Qwen3-4B-Instruct-2507 tokenizer/template for pure
# non-thinking SFT.
#
# Export/push first:
#
#   uv run --project environments/rlm_rlvr python pipelines/rlm_traces/export_sft.py \
#     --format per_root_turn \
#     --output-dir outputs/rlm_traces/combined-good-sft-traces-v2/sft_dataset_v3_per_root_turn_qwen3_8b_nonthinking \
#     --dataset-id lsteno/rlm-rlvr-sft-v3-per-root-turn-qwen3-8b-nonthinking \
#     --tokenizer Qwen/Qwen3-8B \
#     --chat-template-kwargs-json '{"enable_thinking": false}' \
#     --validate-tokenization
#
# Run from prime-rl:
#
#   HF_MODEL_REPO_ID=lsteno/Qwen3-8B-RLM-SFT-v3-per-root-turn \
#   ../scripts/rlm_sft/run_curated_v2_with_upload.sh \
#     ../configs/rlm_sft/local_8xa100_80gb_qwen3_8b_nonthinking_curated_v3_per_root_turn.toml \
#     ../outputs/rlm-rlvr-sft-curated-v3-per-root-turn-qwen3-8b-nonthinking-8xa100 \
#     lsteno/Qwen3-8B-RLM-SFT-v3-per-root-turn

output_dir = "../outputs/rlm-rlvr-sft-curated-v3-per-root-turn-qwen3-8b-nonthinking-template-8xa100"
max_steps = 180
loss_impl = "liger_fused"
dist_timeout_seconds = 1800

[deployment]
type = "single_node"
gpus_per_node = 8
num_gpus = 8

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-sft-v3-per-root-turn-qwen3-8b-nonthinking-template-8xa100"
offline = false

[model]
name = "Qwen/Qwen3-8B"
seq_len = 32768
impl = "hf"
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
cp = 4
tp = 1
dp_replicate = 1

[model.ac]
freq = 1

[tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"
trust_remote_code = true

[data]
type = "sft"
name = "lsteno/rlm-rlvr-sft-v3-per-root-turn-qwen3-8b-nonthinking"
splits = ["train"]
batch_size = 64
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = true
seed = 42

[data.loss_mask]
system = false
user = false
assistant = true
tool = false
train_on_prompt = false

[val]
interval = 15
eval_on_start = true

[val.data]
type = "sft"
name = "lsteno/rlm-rlvr-sft-v3-per-root-turn-qwen3-8b-nonthinking"
splits = ["eval"]
batch_size = 64
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = false
seed = 42

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false
train_on_prompt = false

[optim]
lr = 5e-6
weight_decay = 0.01
max_norm = 1.0

[scheduler]
type = "cosine"
warmup_steps = 10
min_lr = 5e-7

[ckpt]
interval = 60
keep_last = 3

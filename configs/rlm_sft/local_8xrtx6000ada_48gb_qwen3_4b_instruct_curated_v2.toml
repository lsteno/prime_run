# Full-SFT warmup for the curated RLM trace conversation dataset.
#
# Run from prime-rl after exporting/pushing
# lsteno/rlm-rlvr-sft-v2-conversations:
#
#   cd prime-rl
#   uv run torchrun \
#     --local-ranks-filter 0 \
#     --nproc-per-node 8 \
#     src/prime_rl/trainer/sft/train.py \
#     @ ../configs/rlm_sft/local_8xrtx6000ada_48gb_qwen3_4b_instruct_curated_v2.toml

output_dir = "../outputs/rlm-rlvr-sft-curated-v2-qwen3-4b-instruct-8xrtx6000ada"
max_steps = 60
loss_impl = "liger_fused"

[deployment]
type = "single_node"
gpus_per_node = 8
num_gpus = 8

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-sft-curated-v2-qwen3-4b-instruct-8xrtx6000ada"
offline = false

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"
impl = "hf"
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
cp = 4
tp = 1
dp_replicate = 1

[model.ac]
freq = 1

[tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"
trust_remote_code = true

[data]
type = "sft"
name = "lsteno/rlm-rlvr-sft-v2-conversations"
splits = ["train"]
batch_size = 32
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = true
seed = 42

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

[val]
interval = 10
eval_on_start = true

[val.data]
type = "sft"
name = "lsteno/rlm-rlvr-sft-v2-conversations"
# Hugging Face's scriptless JSONL loader maps eval.jsonl to the `test` split.
splits = ["test"]
batch_size = 32
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = false
seed = 42

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

[optim]
lr = 5e-6
weight_decay = 0.01
max_norm = 1.0

[scheduler]
type = "cosine"
warmup_steps = 5
min_lr = 5e-7

[ckpt]
interval = 25
keep_last = 3

output_dir = "../outputs/rlm-rlvr-sft-glm5-qwen3-4b-instruct-8xrtx6000ada"
max_steps = 200
loss_impl = "liger_fused"

[deployment]
gpus_per_node = 8
num_gpus = 8

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-sft-glm5-qwen3-4b-instruct-8xrtx6000ada"
offline = false

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"
impl = "custom"
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
cp = 4
tp = 1
dp_replicate = 1

[model.ac]
freq = 1

[tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"

[data]
type = "sft"
name = "lsteno/rlm-rlvr-glm5-sft"
splits = ["train"]
batch_size = 128
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = true

[val]
interval = 20
eval_on_start = true

[val.data]
type = "sft"
name = "lsteno/rlm-rlvr-glm5-sft"
splits = ["eval"]
batch_size = 32
micro_batch_size = 1
seq_len = 32768
pack_function = "cat"
shuffle = false

[optim]
lr = 5e-6
weight_decay = 0.01
max_norm = 1.0

[scheduler]
type = "cosine"
warmup_steps = 10
min_lr = 5e-7

[ckpt]
interval = 50
keep_last = 3

name = "rlm-rlvr-hosted-long-deep-qwen35-9b"
model = "Qwen/Qwen3.5-9B"
max_steps = 50

batch_size = 4
rollouts_per_example = 1
learning_rate = 8e-7
lora_alpha = 32
max_async_level = 1

[sampling]
max_tokens = 2048
temperature = 0.7

[[env]]
id = "lsteno/rlm-rlvr"
args = { dataset_id = "lsteno/BEEG-agents", dataset_train_split = "train", dataset_eval_split = "eval", max_examples = 512, max_eval_examples = 16, max_iterations = 12, max_depth = 3, turn_max_tokens = 2048, subcall_max_tokens = 2048, judge_model = "z-ai/glm-4.7-flash" }

# Generated by scripts/rlm_rlvr/generate_rank_lr_ablation_configs.py.
# Keep these as separate runs so LoRA rank is a true trainer-side ablation.
# Depth-1 LLM-only setup: prompt omits RLM tools; runtime max_depth=0 blocks recursive RLM children.
# Plain llm_query* subcalls reuse the root policy endpoint; Vertex is used only for judging.
# Dataset: local derived BEEG parquets (balanced35_40_25_frames40_v1) with train/eval near 35% oolong, 40% frames, 25% longcodeu.
# Ablation parameters: rank=64, alpha=128, lr=5e-7, max_steps=150.

# LoRA rank/LR ablation run for Qwen3 4B Instruct on a single 8x A100 80GB node,
# with depth-1 LLM-only orchestration, lower rollout pressure, and an enabled subcall budget.
#
# Layout:
# - GPUs 0-3: vLLM inference, four data-parallel replicas for rollout throughput.
# - GPUs 4-7: LoRA trainer, context-parallel over a 48k flattened RLM trajectory.
#
# Run from prime-rl:
#   cd prime-rl
#   uv run rl @ ../configs/rlm_rlvr/ablation_rank_lr/qwen3_4b_instruct_sanjaya_depth1_llmonly_r064_a128_lr5e-7_s150_8xa10080_bal35f40v1.toml

output_dir = "../outputs/rlm-rlvr-qwen3-4b-depth1-llmonly-r64-a128-lr5e-7-s150-bal35f40v1"
max_steps = 150
max_async_level = 2
seq_len = 49152

[deployment]
type = "single_node"
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 4

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-qwen3-4b-depth1-llmonly-r64-a128-lr5e-7-s150-bal35f40v1"

[ckpt]
interval = 25
keep_last = 2
keep_interval = 100

[trainer.optim]
type = "adamw"
lr = 5e-7
weight_decay = 0.0
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.model]
seq_len = 49152
attn = "flash_attention_2"
cp = 2
tp = 1
dp_replicate = 1
optimization_dtype = "float32"
reduce_dtype = "float32"
fused_lm_head_token_chunk_size = "auto"

[trainer.model.ac]
freq = 2

[trainer.model.lora]
rank = 64
alpha = 128
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"
trust_remote_code = true

[trainer.loss]
type = "default"
kl_tau = 1e-3
teacher_tau = 0.0

[orchestrator]
batch_size = 64
rollouts_per_example = 4
oversampling_factor = 1.0
max_concurrent = 32
rollout_timeout_seconds = 400
seq_len = 49152
use_token_client = false
max_off_policy_steps = 4

[orchestrator.env_worker_recovery]
enabled = true
cancel_grace_seconds = 5
max_rollout_attempts_per_slot = 4
max_attempts_cooldown_steps = 5
drop_group_on_first_timeout = false
first_timeout_cooldown_steps = 5
restart_on_rollout_timeout = true
restart_on_worker_health_failure = true

[orchestrator.attempt_logging]
enabled = true

[orchestrator.async_scheduling]
prefetch_next_batch = false
inflight_completion_cushion = 32
max_requests_per_env_worker = 1
max_cross_step_carryover = 32
max_carryover_steps = 1
cancel_stale_carryover = true
restart_workers_for_stale_cancel = true
batch_complete_cancel_grace_seconds = 2

[orchestrator.group_scoring]
enabled = true
max_concurrency = 8
max_pending_groups = 64

[orchestrator.sampling]
temperature = 0.7
max_tokens = 2048
extra_body = { return_token_ids = true, top_k = -1, min_p = 0.0 }

[orchestrator.buffer]
online_difficulty_filtering = true
online_filter_hard = true
online_filter_easy = false
hard_threshold = 0.0
hard_cooldown_steps = 5
seed = 42

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10
sample_max_chars = 8000
sample_include_input_ids = false
final_samples = false

[[orchestrator.env]]
id = "rlm_rlvr"
worker_count = 32

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
data_paths = ["../data/beeg_agents_balanced_35_40_25_frames40_v1/train.parquet"]
eval_data_paths = ["../data/beeg_agents_balanced_35_40_25_frames40_v1/eval.parquet"]
dataset_train_split = "train"
dataset_eval_split = "eval"
seed = 42
max_examples = 4096
max_eval_examples = 256
prompt_variant = "sanjaya_text_depth1_llm_only_v1"
max_iterations = 15
max_depth = 0
turn_max_tokens = 2048
subcall_max_tokens = 2048
max_prompt_tokens = 47104
subcall_prompt_limit_ratio = 0.85
subcall_budget_enabled = true
max_total_subcalls = 50
max_batched_subcalls = 50
subcall_batch_max_workers = 2
tokenizer_name = "Qwen/Qwen3-4B-Instruct-2507"
inference_mode = "local"
inference_base_url = "http://localhost:8000/v1"
inference_api_key = "local-vllm"
repl_backend = "local"
repl_timeout_seconds = 300
repl_fast_timeout_seconds = 30
judge_provider = "vertex"
judge_model = "gemini-3-flash-preview"
judge_vertex_project_env = "GOOGLE_CLOUD_PROJECT"
judge_vertex_location = "global"
judge_thinking_level = "medium"
efficiency_penalty_mode = "adaptive_group"
adaptive_efficiency_beta_max = 0.15
adaptive_efficiency_gamma = 1.0
adaptive_efficiency_solve_rate_floor = 0.25
adaptive_efficiency_cost_basis = "total_tokens"
efficiency_penalty_applies_to = "all_rollouts"
reward_clip_min = -0.5
reward_clip_max = 1.0
max_turn_penalty_enabled = true
max_turn_penalty = 0.25
missing_final_at_max_turn_zero_reward = true
live_trace_dir = "../outputs/rlm-rlvr-qwen3-4b-depth1-llmonly-r64-a128-lr5e-7-s150-bal35f40v1/live_traces"

[orchestrator.eval]
interval = 25
num_examples = 64
rollouts_per_example = 1
eval_base_model = false
cancel_inflight_rollouts_on_eval = true

[orchestrator.eval.sampling]
temperature = 0.7
max_tokens = 2048
top_p = 1.0
extra_body = { return_token_ids = true, top_k = -1, min_p = 0.0 }

[[orchestrator.eval.env]]
id = "rlm_rlvr"
name = "rlm_rlvr_eval"
worker_count = 16
num_examples = 64
rollouts_per_example = 1

[orchestrator.eval.env.args]
dataset_id = "lsteno/BEEG-agents"
data_paths = ["../data/beeg_agents_balanced_35_40_25_frames40_v1/train.parquet"]
eval_data_paths = ["../data/beeg_agents_balanced_35_40_25_frames40_v1/eval.parquet"]
dataset_train_split = "train"
dataset_eval_split = "eval"
seed = 42
max_examples = 4096
max_eval_examples = 256
prompt_variant = "sanjaya_text_depth1_llm_only_v1"
max_iterations = 15
max_depth = 0
turn_max_tokens = 2048
subcall_max_tokens = 2048
max_prompt_tokens = 47104
subcall_prompt_limit_ratio = 0.85
subcall_budget_enabled = true
max_total_subcalls = 50
max_batched_subcalls = 50
subcall_batch_max_workers = 2
tokenizer_name = "Qwen/Qwen3-4B-Instruct-2507"
inference_mode = "local"
inference_base_url = "http://localhost:8000/v1"
inference_api_key = "local-vllm"
repl_backend = "local"
repl_timeout_seconds = 300
repl_fast_timeout_seconds = 30
judge_provider = "vertex"
judge_model = "gemini-3-flash-preview"
judge_vertex_project_env = "GOOGLE_CLOUD_PROJECT"
judge_vertex_location = "global"
judge_thinking_level = "medium"
efficiency_penalty_mode = "static_per_1k"
efficiency_penalty_coef = 0.0
efficiency_penalty_applies_to = "all_rollouts"
reward_clip_min = -0.5
reward_clip_max = 1.0
max_turn_penalty_enabled = true
max_turn_penalty = 0.25
missing_final_at_max_turn_zero_reward = true
live_trace_dir = "../outputs/rlm-rlvr-qwen3-4b-depth1-llmonly-r64-a128-lr5e-7-s150-bal35f40v1/live_traces_eval"

[inference]
gpu_memory_utilization = 0.90
enable_prefix_caching = true
max_loras = 8
max_cpu_loras = 16
api_server_count = 1

[inference.server]
host = "0.0.0.0"
port = 8000

[inference.model]
name = "Qwen/Qwen3-4B-Instruct-2507"
max_model_len = 49152
enforce_eager = false
trust_remote_code = true

[inference.parallel]
tp = 1
dp = 4

[inference.deployment]
type = "single_node"
gpus_per_node = 4

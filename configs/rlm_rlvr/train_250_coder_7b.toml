output_dir = "outputs/rlm-rlvr-train-250-coder-7b"
max_steps = 63
seq_len = 2048

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen2.5-Coder-7B-Instruct"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-train-250-coder-7b"
offline = true

[trainer.optim]
lr = 2e-6
weight_decay = 0.0

[trainer.model.lora]
rank = 16
dropout = 0.0

[trainer.tokenizer]
name = "Qwen/Qwen2.5-Coder-7B-Instruct"

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 4
rollouts_per_example = 1
use_token_client = true

[orchestrator.sampling]
max_tokens = 128

# Keep env-worker logs and sample logging enabled so recursive traces are inspectable.
[orchestrator.log]
env_worker_logs = true
log_data = true

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
data_paths = ["/home/coder/rl_training/data/train.parquet"]
eval_fraction = 0.05
max_examples = 250
max_eval_examples = 16
max_iterations = 2
max_depth = 2
turn_max_tokens = 128
subcall_max_tokens = 64
tokenizer_name = "Qwen/Qwen2.5-Coder-7B-Instruct"
efficiency_penalty_coef = 0.02

[inference]
gpu_memory_utilization = 0.85

[inference.model]
max_model_len = 2048
enforce_eager = true

# Save frequent checkpoints and preserve recent ones.
# Rollouts, including rlm_trace and rlm_segments emitted by the env, are persisted
# under output_dir/rollouts/ by the default filesystem rollout transport.
[ckpt]
interval = 10
keep_last = 3
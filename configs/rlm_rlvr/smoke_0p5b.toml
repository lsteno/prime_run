output_dir = "outputs/rlm-rlvr-smoke"
max_steps = 5
seq_len = 4096

[deployment]
gpus_per_node = 4
num_train_gpus = 1
num_infer_gpus = 3

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-smoke"

[trainer.optim]
lr = 2e-6
weight_decay = 0.0

[trainer.model.lora]
rank = 16
dropout = 0.0

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 32
rollouts_per_example = 4
use_token_client = true

[orchestrator.sampling]
max_tokens = 192

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
data_paths = ["/home/coder/prime_run/data/train_with_context_tokens_split_20260313/train_curriculum.parquet"]
eval_data_paths = ["/home/coder/prime_run/data/train_with_context_tokens_split_20260313/eval.parquet"]
max_examples = 128
max_eval_examples = 32
max_iterations = 3
max_depth = 2
turn_max_tokens = 192
subcall_max_tokens = 96
tokenizer_name = "Qwen/Qwen2.5-0.5B-Instruct"
efficiency_penalty_coef = 0.02

[ckpt]

[inference]
output_dir = "outputs/rlm-rlvr-no-tito-smoke-qwen3-4b"
max_steps = 2
seq_len = 16384

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-4B-Thinking-2507"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-no-tito-smoke-qwen3-4b"
offline = true

[trainer.optim]
lr = 8e-7
weight_decay = 0.0

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Thinking-2507"

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 8
rollouts_per_example = 2
max_async_level = 1
use_token_client = false

[orchestrator.sampling]
max_tokens = 1024
temperature = 0.7

[orchestrator.log]
env_worker_logs = true
log_data = true

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
dataset_train_split = "train"
dataset_eval_split = "eval"
max_examples = 32
max_eval_examples = 8
max_iterations = 12
max_depth = 3
turn_max_tokens = 1024
subcall_max_tokens = 512
tokenizer_name = "Qwen/Qwen3-4B-Thinking-2507"
efficiency_penalty_coef = 0.02
inference_mode = "local"
judge_model = "minimax/minimax-m2.7"

[inference]
gpu_memory_utilization = 0.7

[inference.model]
max_model_len = 32768
enforce_eager = false

[ckpt]
interval = 5
keep_last = 2

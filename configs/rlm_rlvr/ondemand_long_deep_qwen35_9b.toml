output_dir = "outputs/rlm-rlvr-ondemand-long-deep-qwen35-9b"
max_steps = 50
seq_len = 32768

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-9B"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-ondemand-long-deep-qwen35-9b"

[trainer.optim]
lr = 8e-7
weight_decay = 0.0

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3.5-9B"

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 4
rollouts_per_example = 1
max_async_level = 1
use_token_client = false

[orchestrator.sampling]
max_tokens = 2048
temperature = 0.7

[orchestrator.log]
env_worker_logs = true
log_data = true

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
dataset_train_split = "train"
dataset_eval_split = "eval"
max_examples = 512
max_eval_examples = 16
max_iterations = 12
max_depth = 3
turn_max_tokens = 2048
subcall_max_tokens = 2048
tokenizer_name = "Qwen/Qwen3.5-9B"
efficiency_penalty_coef = 0.02
inference_mode = "local"
judge_model = "z-ai/glm-4.7-flash"

[inference]
gpu_memory_utilization = 0.7

[inference.model]
max_model_len = 32768
enforce_eager = false

[ckpt]
interval = 10
keep_last = 3

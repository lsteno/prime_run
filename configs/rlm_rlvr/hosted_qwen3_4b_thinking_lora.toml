name = "rlm-rlvr-qwen3-4b-thinking-lora"
model = "Qwen/Qwen3-4B-Thinking-2507"
max_steps = 200

batch_size = 64
rollouts_per_example = 4
learning_rate = 8e-7
lora_alpha = 32
oversampling_factor = 2.0
max_async_level = 4

[sampling]
max_tokens = 512
temperature = 0.7

[[env]]
id = "lsteno/rlm-rlvr"
args = { dataset_id = "lsteno/BEEG-agents", dataset_train_split = "train", dataset_eval_split = "eval", max_examples = 2000, max_eval_examples = 128, max_iterations = 4, max_depth = 2, turn_max_tokens = 512, subcall_max_tokens = 256 }

[eval]
interval = 25
num_examples = 32
rollouts_per_example = 2
eval_base_model = true

[[eval.env]]
id = "lsteno/rlm-rlvr"
args = { dataset_id = "lsteno/BEEG-agents", dataset_train_split = "train", dataset_eval_split = "eval", max_examples = 2000, max_eval_examples = 128, max_iterations = 4, max_depth = 2, turn_max_tokens = 512, subcall_max_tokens = 256 }

[buffer]
easy_threshold = 0.8
hard_threshold = 0.2
easy_fraction = 0.0
hard_fraction = 0.0
online_difficulty_filtering = true
skip_verification = false
seed = 42

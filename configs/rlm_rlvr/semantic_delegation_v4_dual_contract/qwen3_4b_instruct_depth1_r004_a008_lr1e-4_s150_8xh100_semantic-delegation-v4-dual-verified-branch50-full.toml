# Generated by scripts/rlm_rlvr/generate_semantic_delegation_v4_configs.py.
# Keep these as separate runs so LoRA rank is a true trainer-side ablation.
# Depth-1 LLM-only setup: root policy can call plain llm_query* subcalls; recursive child RLMs are disabled.
# Plain llm_query* subcalls reuse the root policy endpoint and are trainable; Vertex is used only for judging.
# Template shape: latest 8xH100 depth-2 run config, with depth/runtime knobs changed to depth 1.
# Stable LoRA/depth-2 setup: 4 inference / 4 train with filesystem checkpoint broadcast enabled.
# Data: private full BEEG mixture with Oolong replaced by semantic delegation v4 with verified dual child contracts.
# Sweep parameters: rank=4, alpha=8, lr=1e-4, max_steps=150.

output_dir = "../outputs/rlm-rlvr-qwen3-4b-depth1-h100-r4-a8-lr1e-4-s150-semantic-delegation-v4-dual-verified-branch50-full"
max_steps = 150
max_async_level = 2
seq_len = 49152

[deployment]
type = "single_node"
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 4

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
entity = "lsteno-university-of-twente"
project = "rlm-rlvr"
name = "rlm-rlvr-qwen3-4b-depth1-h100-r4-a8-lr1e-4-s150-semantic-delegation-v4-dual-verified-branch50-full"

[ckpt]
interval = 25
keep_last = 2
keep_interval = 100

[trainer.optim]
type = "adamw"
lr = 1e-4
weight_decay = 0.0
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.model]
seq_len = 49152
attn = "flash_attention_2"
cp = 2
tp = 1
dp_replicate = 1
optimization_dtype = "float32"
reduce_dtype = "float32"
fused_lm_head_token_chunk_size = "auto"

[trainer.model.ac]
freq = 2

[trainer.model.lora]
rank = 4
alpha = 8
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"
trust_remote_code = true

[trainer.loss]
type = "default"
kl_tau = 1e-3
teacher_tau = 0.0
normalization = "branch_sequence"
semantic_child_fraction = 0.5

[orchestrator]
batch_size = 64
rollouts_per_example = 4
oversampling_factor = 1.0
max_concurrent = 32
rollout_timeout_seconds = 400
seq_len = 49152
use_token_client = false
max_off_policy_steps = 4
max_trainable_llm_subcalls_per_rollout = 3
semantic_child_local_advantage_weight = 0.8

[orchestrator.client]
base_url = ["http://localhost:8001/v1"]

[orchestrator.env_worker_recovery]
enabled = true
cancel_grace_seconds = 5
max_rollout_attempts_per_slot = 4
max_attempts_cooldown_steps = 5
drop_group_on_first_timeout = false
first_timeout_cooldown_steps = 5
restart_on_rollout_timeout = true
restart_on_worker_health_failure = true

[orchestrator.attempt_logging]
enabled = true

[orchestrator.async_scheduling]
prefetch_next_batch = false
inflight_completion_cushion = 32
max_requests_per_env_worker = 1
max_cross_step_carryover = 32
max_carryover_steps = 1
cancel_stale_carryover = true
restart_workers_for_stale_cancel = true
batch_complete_cancel_grace_seconds = 2

[orchestrator.group_scoring]
enabled = true
max_concurrency = 8
max_pending_groups = 64

[orchestrator.sampling]
temperature = 0.7
max_tokens = 2048
extra_body = { return_token_ids = true, top_k = -1, min_p = 0.0 }

[orchestrator.buffer]
online_difficulty_filtering = true
online_filter_hard = true
online_filter_easy = false
easy_threshold = 1.0
easy_fraction = 0.0
hard_threshold = 0.0
hard_cooldown_steps = 5
seed = 42
difficulty_metric = "semantic_progress_metric"
hash_keys = ["example_id"]
curriculum_bucket_path = "metadata.curriculum_bucket"
curriculum_base_bucket = "base"

[[orchestrator.buffer.curriculum_phases]]
start_step = 0
end_step = 29
weights = { base = 0.65, semantic_4 = 0.35 }

[[orchestrator.buffer.curriculum_phases]]
start_step = 30
end_step = 79
weights = { base = 0.65, semantic_4 = 0.0875, semantic_8 = 0.2625 }

[[orchestrator.buffer.curriculum_phases]]
start_step = 80
end_step = 149
weights = { base = 0.65, semantic_4 = 0.035, semantic_8 = 0.070, semantic_16 = 0.210, semantic_global = 0.035 }

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[orchestrator.wandb.log_extras]
samples = true
distributions = true
interval = 10
sample_max_chars = 8000
sample_include_input_ids = false
final_samples = false

[[orchestrator.env]]
id = "rlm_rlvr"
worker_count = 32

[orchestrator.env.args]

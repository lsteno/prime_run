reward_clip_min = -0.5
reward_clip_max = 1.0
max_turn_penalty_enabled = true
max_turn_penalty = 0.5
missing_final_at_max_turn_zero_reward = true
live_trace_dir = "../outputs/rlm-rlvr-qwen3-4b-depth1-h100-r4-a8-lr1e-4-s150-semantic-delegation-v4-dual-verified-branch50-full/live_traces"

[orchestrator.eval]

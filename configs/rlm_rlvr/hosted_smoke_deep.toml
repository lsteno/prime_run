name = "rlm-rlvr-hosted-smoke-deep"
model = "Qwen/Qwen3-4B-Thinking-2507"
max_steps = 2

batch_size = 4
rollouts_per_example = 1
learning_rate = 8e-7
lora_alpha = 32
max_async_level = 1

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "lsteno/rlm-rlvr"
args = { dataset_id = "lsteno/BEEG-agents", dataset_train_split = "train", dataset_eval_split = "eval", max_examples = 16, max_eval_examples = 4, max_iterations = 12, max_depth = 3, turn_max_tokens = 1024, subcall_max_tokens = 512, judge_model = "minimax/minimax-m2.7" }

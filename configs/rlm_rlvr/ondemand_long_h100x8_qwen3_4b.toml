output_dir = "outputs/rlm-rlvr-ondemand-long-h100x8-qwen3-4b-v3"
max_steps = 20
seq_len = 12288

[deployment]
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "Qwen/Qwen3-4B-Thinking-2507"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-ondemand-long-h100x8-qwen3-4b-v3"
offline = true

[trainer.optim]
lr = 8e-7
weight_decay = 0.0

[trainer.model]
optimization_dtype = "bfloat16"

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Thinking-2507"

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 2
rollouts_per_example = 1
max_inflight_rollouts = 2
max_concurrent = 2
max_async_level = 1
use_token_client = false

[orchestrator.sampling]
max_tokens = 2048
temperature = 0.7

[orchestrator.log]
env_worker_logs = true
log_data = true

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
dataset_train_split = "train"
dataset_eval_split = "eval"
max_examples = 128
max_eval_examples = 32
max_iterations = 6
max_depth = 2
turn_max_tokens = 1536
subcall_max_tokens = 768
tokenizer_name = "Qwen/Qwen3-4B-Thinking-2507"
efficiency_penalty_coef = 0.02
inference_mode = "local"
judge_model = "z-ai/glm-4.7-flash"

[inference]
gpu_memory_utilization = 0.7

[inference.parallel]
tp = 1

[inference.model]
max_model_len = 12288
enforce_eager = false

[ckpt]
interval = 5
keep_last = 3

output_dir = "outputs/rlm-rlvr-7b"
max_steps = 200
seq_len = 8192

[deployment]
gpus_per_node = 4
num_train_gpus = 2
num_infer_gpus = 2

[model]
name = "Qwen/Qwen2.5-7B-Instruct"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-7b"

[trainer.optim]
lr = 1e-6
weight_decay = 0.0

[trainer.model.lora]
rank = 16
dropout = 0.0

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 64
rollouts_per_example = 8
use_token_client = true

[orchestrator.sampling]
max_tokens = 256

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
data_paths = ["/home/coder/prime_run/data/train_with_context_tokens_split_20260313/train_curriculum.parquet"]
eval_data_paths = ["/home/coder/prime_run/data/train_with_context_tokens_split_20260313/eval.parquet"]
max_examples = -1
max_eval_examples = 512
max_iterations = 4
max_depth = 2
turn_max_tokens = 256
subcall_max_tokens = 128
tokenizer_name = "Qwen/Qwen2.5-7B-Instruct"
efficiency_penalty_coef = 0.02

[ckpt]

[inference]
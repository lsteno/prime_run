output_dir = "outputs/rlm-rlvr-train-250"
max_steps = 63
seq_len = 2048

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-train-250"
offline = true

[trainer.optim]
lr = 2e-6
weight_decay = 0.0

[trainer.model.lora]
rank = 16
dropout = 0.0

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 4
rollouts_per_example = 1
use_token_client = true

[orchestrator.sampling]
max_tokens = 128

# Enable per-env-worker logs (captures rlm_trace data) and log first training sample
[orchestrator.log]
env_worker_logs = true
log_data = true

[[orchestrator.env]]
id = "rlm_rlvr"

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
dataset_train_split = "train"
dataset_eval_split = "eval"
max_examples = 250
max_eval_examples = 16
max_iterations = 2
max_depth = 2
turn_max_tokens = 128
subcall_max_tokens = 64
tokenizer_name = "Qwen/Qwen2.5-0.5B-Instruct"
efficiency_penalty_coef = 0.02

[inference]
# GPU 1 (~47/98 GiB free from cluster neighbors) → cap at 46% (~45 GiB)
# GPU 2 is nearly fully free, so trainer has no special constraint
gpu_memory_utilization = 0.46

# Save a checkpoint every 10 steps; keep only the 3 most recent to save disk space.
# Rollouts (including rlm_trace/rlm_segments) are saved automatically to output_dir/rollouts/
# via the default filesystem rollout transport.
[ckpt]
interval = 10
keep_last = 3

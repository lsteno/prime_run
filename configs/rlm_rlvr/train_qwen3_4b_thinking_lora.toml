output_dir = "outputs/rlm-rlvr-qwen3-4b-thinking-lora"
max_steps = 200
seq_len = 8192

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-4B-Thinking-2507"

[wandb]
project = "rlm-rlvr"
name = "rlm-rlvr-qwen3-4b-thinking-lora"
offline = true

[trainer.optim]
lr = 8e-7
weight_decay = 0.0

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Thinking-2507"

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.grpo_loss.clipped_grpo_loss"
kwargs = { clip_eps = 0.2 }

[orchestrator]
batch_size = 64
rollouts_per_example = 4
use_token_client = true

[orchestrator.sampling]
max_tokens = 512

[orchestrator.log]
env_worker_logs = true
log_data = true

[orchestrator.trace_export]
enabled = true
include_segments = true
include_metrics = true

[[orchestrator.env]]
id = "lsteno/rlm-rlvr"

[orchestrator.env.args]
dataset_id = "lsteno/BEEG-agents"
dataset_train_split = "train"
dataset_eval_split = "eval"
max_examples = 2000
max_eval_examples = 128
max_iterations = 4
max_depth = 2
turn_max_tokens = 512
subcall_max_tokens = 256

[inference]
gpu_memory_utilization = 0.7

[inference.model]
max_model_len = 32768
enforce_eager = false

[ckpt]
interval = 20
keep_last = 3
